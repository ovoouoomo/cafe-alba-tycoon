<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2416">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>마감 알바 타이쿤</title>
<style>
:root{
  --bg:#f6efe2;--card:#fffaf2;--card2:#fbf3e4;--ink:#2a1c12;--muted:#7b6a5c;--line:#e3d4bd;
  --brand:#3b2416;--brand-ink:#fff7ea;--accent:#ffbe1a;--accent-ink:#2a1c12;
  --ok:#23945a;--ok-bg:#e3f5ea;--bad:#d23f3f;--bad-bg:#fde8e6;--warn:#d98a0b;--warn-bg:#fff2d9;
  --blue:#2a64c9;--hot:#e2552d;--ice:#2a86d6;--shadow:0 1px 0 rgba(0,0,0,.05),0 6px 16px rgba(70,40,10,.08);
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1410;--card:#261d17;--card2:#2e231b;--ink:#f3e9dc;--muted:#b3a291;--line:#43352a;
  --brand:#120c08;--brand-ink:#fff3e0;--accent:#ffc331;--accent-ink:#1b1410;
  --ok-bg:#183626;--bad-bg:#3e1d1b;--warn-bg:#3b2c12;--shadow:0 1px 0 rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#1b1410;--card:#261d17;--card2:#2e231b;--ink:#f3e9dc;--muted:#b3a291;--line:#43352a;
  --brand:#120c08;--brand-ink:#fff3e0;--accent:#ffc331;--accent-ink:#1b1410;
  --ok-bg:#183626;--bad-bg:#3e1d1b;--warn-bg:#3b2c12;--shadow:0 1px 0 rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
input,select{font:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.86em}
.screen{display:none;min-height:100dvh}
.screen.on{display:block}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:700;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dark{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;font-weight:600}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.chip.big{min-height:46px;min-width:64px;border-radius:12px;font-size:1.02em}
.badge{display:inline-block;font-size:.72em;font-weight:800;padding:2px 6px;border-radius:6px;vertical-align:middle;letter-spacing:.02em}
.badge.HOT{background:var(--hot);color:#fff}.badge.ICE{background:var(--ice);color:#fff}.badge.ESP{background:#5b3416;color:#fff}
.badge.tag{background:var(--warn-bg);color:var(--warn)}
.badge.red{background:var(--bad);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}

/* ---------- MENU ---------- */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:22px 20px;position:relative;overflow:hidden}
.hero h1{margin:0 0 4px;font-size:1.65em;letter-spacing:-.02em}
.hero p{margin:0;opacity:.85}
.hero .cupdeco{position:absolute;right:-10px;bottom:-14px;font-size:96px;opacity:.18;transform:rotate(-10deg)}
.daycard{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:.78em}
.stat b{font-size:1.15em}
.menu-grid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.menu-btn{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;min-height:76px}
.menu-btn .ic{font-size:30px;width:44px;text-align:center}
.menu-btn b{display:block;font-size:1.05em}
.menu-btn span{color:var(--muted);font-size:.86em}
.menu-btn.main{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.menu-btn.main span{color:inherit;opacity:.8}
.weak{margin-top:14px}

/* ---------- GAME ---------- */
#scr-game.on{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.hud{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--brand);color:var(--brand-ink);flex-wrap:nowrap;overflow-x:auto}
.hud .iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:10px;min-width:42px;height:42px;font-size:18px;color:inherit;flex:none}
.hud-day{font-weight:800;white-space:nowrap;font-size:.92em}
.hud-clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.35em;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:10px;white-space:nowrap}
.hud-stat{display:flex;flex-direction:column;line-height:1.1;white-space:nowrap;font-size:.95em}
.hud-stat small{opacity:.7;font-size:.72em}
.hud .sp{flex:1}
.game-grid{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(300px,1fr) minmax(380px,460px);gap:10px;padding:10px}
.orders,.work,.stations{min-height:0;display:flex;flex-direction:column}
.sec-title{font-weight:800;font-size:.9em;color:var(--muted);margin:2px 2px 6px}
.order-list{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-bottom:6px}
.ticket{position:relative;text-align:left;background:#fffdf7;color:#2a1c12;border:1px dashed #cdb998;border-radius:10px;padding:9px 10px 12px;box-shadow:var(--shadow);font-family:inherit;min-width:180px}
.ticket.active{outline:3px solid var(--accent);border-style:solid}
.ticket .no{font-weight:900;font-size:.82em;color:#8b6b4a;display:flex;justify-content:space-between;gap:6px}
.ticket .nm{font-weight:800;margin:3px 0 2px;font-size:1.02em}
.ticket .pbar{position:absolute;left:8px;right:8px;bottom:5px;height:4px;background:#eadfcd;border-radius:3px;overflow:hidden}
.ticket .pbar i{display:block;height:100%;background:var(--ok);transition:width .25s linear}
.ticket.warn .pbar i{background:var(--warn)}
.ticket.late .pbar i{background:var(--bad)}
.ticket.late{animation:shake .5s ease 2}
.ticket .wip{font-size:.75em;color:var(--blue);font-weight:700}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.work{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);overflow:auto}
.now{font-weight:800;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.now .nm{font-size:1.15em}
.work-row{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:10px;align-items:start}
.cupbox{background:linear-gradient(180deg,transparent 70%,rgba(120,80,40,.10));border-radius:12px;display:flex;align-items:flex-end;justify-content:center}
#cupSvg{width:100%;max-width:210px;height:auto;display:block}
.vessels{display:flex;flex-direction:column;gap:6px}
.vessel{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:7px 9px;min-height:44px}
.vessel .vi{font-size:20px;line-height:1.2}
.vessel b{font-size:.86em;display:block}
.vessel .vc{font-size:.8em;color:var(--muted);line-height:1.3}
.vessel.target{outline:2.5px solid var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--card2))}
.vessel .tgt{font-size:.7em;font-weight:800;color:var(--blue)}
.vessel.info{opacity:.9}
.log{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.log .lg{font-size:.8em;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 7px}
.log .lg i{font-style:normal;color:var(--muted);margin-right:3px}
.stations{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:var(--card2);border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;border-radius:10px;padding:6px 2px;min-height:48px;font-size:.78em;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted)}
.tab .ti{font-size:19px}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.panel{padding:10px;overflow:auto;flex:1}
.panel h4{margin:6px 0 6px;font-size:.85em;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.pbtn{border:1px solid var(--line);background:var(--card2);border-radius:12px;min-height:56px;padding:6px;font-weight:700;font-size:.9em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;text-align:center}
.pbtn small{font-weight:500;color:var(--muted);font-size:.74em}
.pbtn .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.pbtn.wide{grid-column:span 2}
.pbtn.go{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pbtn.blue{background:color-mix(in srgb,var(--blue) 14%,var(--card2))}
.pbtn .cnt{position:relative}
.pbtn:active{transform:scale(.97)}
.subtabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px}
.subtabs .chip{white-space:nowrap}
.tgtbar{font-size:.8em;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tgtbar b{color:var(--blue)}
.actbar{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.actbar .btn{flex:1;padding:8px 6px;font-size:.92em}
.actbar .btn.primary{flex:1.6;font-size:1.02em;white-space:nowrap}

@media (max-width:1100px){
  .game-grid{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
  .orders{grid-column:1 / -1}
  .order-list{flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .ticket{min-width:170px;max-width:200px;flex:none}
}
@media (max-width:720px){
  .game-grid{display:flex;flex-direction:column;overflow:auto;padding:8px;gap:8px}
  .orders,.work,.stations{flex:none}
  .work{overflow:visible}
  .work{padding:8px}
  .now{padding-bottom:6px;margin-bottom:6px}
  .work-row{grid-template-columns:96px 1fr;gap:8px}
  .vessels{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .vessel{padding:5px 7px;min-height:40px}
  .vessel .vi{font-size:16px}
  .vessel.info{grid-column:1 / -1}
  .log{margin-top:4px}
  .work .sec-title{margin-top:6px!important}
  .stations{overflow:visible}
  .panel{overflow:visible}
  .tabs{display:flex;overflow-x:auto;gap:2px}
  .tab{flex:none;min-width:62px}
  .hud-stat small{display:none}
  .hud-day{font-size:.78em;white-space:normal;line-height:1.15;max-width:86px}
  .hud-clock{font-size:1.1em}
  .actbar .btn .lb{display:none}
  .actbar .btn{font-size:1.05em}
  .actbar .btn.primary .lb{display:inline}
}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(20,12,6,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal .box{background:var(--card);color:var(--ink);border-radius:18px;width:min(640px,100%);max-height:92dvh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.sheet{align-items:flex-end}
.modal.sheet .box{border-radius:18px 18px 12px 12px;width:min(560px,100%)}
.modal h2,.modal h3{margin:0 0 8px}
.sg-label{font-size:.8em;font-weight:800;color:var(--muted);margin:10px 0 6px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:12px;font-weight:700;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center;transition:opacity .3s}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}

/* result */
.verdict{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.verdict .em{font-size:44px}
.verdict b{font-size:1.25em;display:block}
.checks{display:flex;flex-direction:column;gap:5px;margin:8px 0 12px}
.ck{display:grid;grid-template-columns:28px 64px 1fr;gap:6px;align-items:start;padding:7px 9px;border-radius:10px;font-size:.9em}
.ck.ok{background:var(--ok-bg)}
.ck.bad{background:var(--bad-bg)}
.ck .m{font-weight:900}
.ck.ok .m{color:var(--ok)}.ck.bad .m{color:var(--bad)}
.ck .d div{line-height:1.35}
.ck .d .ex{font-weight:700}
.ck .d .gt{color:var(--muted)}

/* recipe card */
.rcard{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rcard .rh{background:var(--brand);color:var(--brand-ink);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rcard .rh b{font-size:1.1em}
.rcard .rh .pr{margin-left:auto;opacity:.85;font-size:.9em}
.rtab{width:100%;border-collapse:collapse;font-size:.9em}
.rtab th{width:78px;text-align:left;background:var(--card2);color:var(--muted);font-weight:700;padding:7px 10px;vertical-align:top;border-top:1px solid var(--line)}
.rtab td{padding:7px 10px;border-top:1px solid var(--line);line-height:1.4}
.memo{background:var(--warn-bg);color:var(--ink);padding:8px 12px;font-size:.86em;border-top:1px solid var(--line)}
.ordtxt{font-weight:600}
.mylog{font-size:.85em;color:var(--muted);line-height:1.6}

/* book */
.book-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px;color:var(--ink)}
.bk-cat{margin:14px 0 6px;font-weight:900}
.bk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.bk-item{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 10px;display:flex;gap:6px;align-items:center;min-height:44px}
.bk-item .p{margin-left:auto;color:var(--muted);font-size:.82em;white-space:nowrap}
.bk-item .ms{color:var(--warn)}
.gtable{width:100%;border-collapse:collapse;font-size:.9em;margin:6px 0 14px}
.gtable th,.gtable td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.gtable th{background:var(--card2)}

/* quiz */
.qbox{max-width:640px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qcard{padding:18px}
.qcard .qq{font-size:1.15em;font-weight:800;line-height:1.45;margin-bottom:12px}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{text-align:left;border:1.5px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 14px;min-height:50px;font-weight:600;line-height:1.4}
.qopt.right{border-color:var(--ok);background:var(--ok-bg)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.pbar2{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.pbar2 i{display:block;height:100%;background:var(--accent)}

/* closing */
.task-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:10px}
.task{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;min-height:58px;display:flex;gap:10px;align-items:center;position:relative;overflow:hidden}
.task .tk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900}
.task.done{opacity:.6}
.task.done .tk{background:var(--ok);border-color:var(--ok);color:#fff}
.task .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0}
.task.doing .prog{transition:width .7s linear;width:100%}
.grade{font-size:72px;font-weight:900;line-height:1;color:var(--accent)}
/* ---------- SCENE (카페 매장 화면) ---------- */
.gwrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scene{position:relative;height:250px;flex:none;overflow:hidden;background:linear-gradient(180deg,#ecd3a8 0%,#e4c08f 72%,#d2a46d 100%)}
.scene::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(90deg,#3b2416 0 22px,#ffbe1a 22px 44px);z-index:1}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(180deg,#b07a45,#8a5a30);border-top:5px solid #d39a5e;z-index:3;box-shadow:0 -4px 10px rgba(60,30,10,.25)}
.scene-bg{position:absolute;inset:0}
.win{position:absolute;left:3%;top:24px;width:36%;height:118px;border:7px solid #7a4e2c;border-radius:10px;background:linear-gradient(180deg,#18204a,#363c74 70%,#5d4f7a);overflow:hidden}
.win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;background:#7a4e2c;transform:translateX(-50%)}
.win .moon{position:absolute;right:14%;top:12px;width:22px;height:22px;border-radius:50%;background:#fff3c4;box-shadow:0 0 18px #fff3c4}
.win .bld{position:absolute;bottom:0;background-color:#272b52;background-image:radial-gradient(#ffd96a 1.4px,transparent 2px);background-size:10px 12px}
.win .b1{left:3%;width:18%;height:58%}.win .b2{left:24%;width:15%;height:82%}.win .b3{left:54%;width:20%;height:48%}.win .b4{left:77%;width:20%;height:70%}
.lamp{position:absolute;top:0;width:2px;height:42px;background:#5a3a22;z-index:1}
.lamp::after{content:"";position:absolute;left:-15px;top:40px;width:32px;height:16px;border-radius:16px 16px 4px 4px;background:#3b2416;box-shadow:0 16px 34px 12px rgba(255,214,120,.38)}
.lamp.l1{left:47%}.lamp.l2{left:66%}
.board{position:absolute;right:3%;top:24px;width:25%;min-width:118px;background:#2e3a2f;border:6px solid #7a4e2c;border-radius:6px;color:#f3eccd;padding:7px 9px;font-size:11px;display:flex;flex-direction:column;gap:3px;font-family:ui-monospace,monospace}
.board b{font-size:15px;letter-spacing:.2em;color:#ffd96a}
.plant{position:absolute;left:41%;top:110px;font-size:32px}
.queue{position:absolute;left:0;right:0;bottom:0;top:12px;display:flex;align-items:flex-end;gap:4px;padding:0 10px;overflow-x:auto;overflow-y:hidden;z-index:2;scrollbar-width:none}
.queue .empty{align-self:center;margin:auto;background:rgba(255,253,247,.85);color:#5b4636;padding:8px 14px;border-radius:12px;font-weight:700;font-size:.9em}
.cust{flex:none;width:122px;border:0;background:none;padding:0 0 22px;display:flex;flex-direction:column;align-items:center;position:relative;color:#2a1c12;animation:walkin .5s ease}
@keyframes walkin{from{transform:translateX(60px);opacity:0}}
.cust .bubble{position:relative;width:100%;background:#fffdf7;border:2.5px solid #fffdf7;border-radius:14px;padding:6px 8px 7px;text-align:left;box-shadow:0 3px 8px rgba(60,30,10,.2);font-size:12px;line-height:1.25;margin-bottom:6px}
.cust .bubble::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fffdf7;border-bottom:0}
.cust.active .bubble{border-color:#ffbe1a}
.cust .bn{font-weight:900;font-size:13px}
.cust .tg{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.cust .tg span{font-size:10px;font-weight:800;padding:1px 5px;border-radius:6px;background:#f1e6d4;color:#6b4b2e}
.cust .tg .x{background:#d23f3f;color:#fff}.cust .tg .w{background:#2a64c9;color:#fff}
.cust .pat{height:5px;background:#eadfcd;border-radius:3px;margin-top:5px;overflow:hidden}
.cust .pat i{display:block;height:100%;background:#23945a;transition:width .25s linear}
.cust.warn .pat i{background:#d98a0b}.cust.late .pat i{background:#d23f3f}
.cust.late .ani{animation:shake .5s ease 2}
.cust .ani svg{width:82px;height:96px;display:block}
.cust.active .ani svg{filter:drop-shadow(0 0 6px rgba(255,190,26,.9))}
.cust .cno{position:absolute;bottom:4px;left:0;right:0;text-align:center;z-index:4;font-size:10px;font-weight:900;color:#fff4e0;letter-spacing:.03em}
.bench{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,1fr) minmax(380px,1.3fr);gap:10px;padding:10px;overflow:auto}
.bench-left{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;box-shadow:var(--shadow);align-self:start}
.cup-row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:end}
.cupspot{border-radius:12px;background:radial-gradient(ellipse at 50% 96%,rgba(120,80,40,.22),transparent 55%)}
.logbox summary{cursor:pointer;font-weight:700;font-size:.85em;margin-top:8px;color:var(--muted)}
.station-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start}
.stn{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78em;font-weight:800;box-shadow:var(--shadow);min-height:96px;color:var(--ink)}
.stn svg{width:58px;height:58px;display:block}
.stn:active{transform:scale(.95)}
.stn .bdg{position:absolute;top:4px;right:4px;font-size:10px;line-height:1.3;background:var(--blue);color:#fff;border-radius:8px;padding:1px 5px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stn .bdg.ok{background:var(--ok)}.stn .bdg.bad{background:var(--bad)}.stn .bdg.run{background:var(--warn)}
.st-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.st-head svg{width:42px;height:42px}
.st-head h3{margin:0;flex:1}
@media (max-width:1100px){.bench{grid-template-columns:1fr 1fr}}
@media (max-width:720px){
  .scene{height:205px}
  .win{width:44%;height:96px;top:20px}
  .board{width:30%;min-width:96px;font-size:9px;top:20px}.board b{font-size:12px}
  .plant{display:none}
  .cust{width:104px}
  .cust .ani svg{width:66px;height:78px}
  .cust .bubble{font-size:11px;padding:5px 6px}
  .cust .bn{font-size:12px}
  .bench{display:flex;flex-direction:column;padding:8px;gap:8px}
  .bench-left{padding:8px}
  .cup-row{grid-template-columns:104px 1fr;gap:8px}
  .station-grid{gap:5px}
  .stn{min-height:74px;border-radius:12px;font-size:.7em;padding:6px 1px 5px}
  .stn svg{width:40px;height:40px}

.mg-stage{display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,transparent 60%,rgba(120,80,40,.10));border-radius:14px;margin:6px 0}
.mg-stage svg{width:min(240px,62vw);height:auto;display:block}
.mg-read{min-height:24px;font-weight:700;text-align:center;color:var(--muted)}
.hold{width:100%;min-height:72px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-size:1.15em;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;

.hold:disabled{opacity:.7}
.vessel.spill{background:var(--bad-bg);border-color:var(--bad);opacity:1}
.busy{animation:pulse 1s ease infinite}

.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}

  const [no,cat,temp,name,price,cup,shots,ice,blend,liq,ing,top,ok,memo]=a;
  const r={no,cat,temp,name,price,cup:String(cup),shots,ice,blend,memo:memo||'',okey:ok};
  r.liq=liq?liq.split('|').map(s=>{const [t,v,n]=s.split(':');return {t,a:v,n:n||''}}):[];
  r.ing={};r.ingN={};
  if(ing)ing.split('|').forEach(s=>{const [k,v,n]=s.split(':');if(!ITEMS[k])console.warn('unknown item',k,no);r.ing[k]=isNaN(+v)?v:+v;if(n)r.ingN[k]=n;});
  r.top={};
  if(top)top.split('|').forEach(s=>{const [k,c]=s.split(':');if(!TOPS.includes(k))console.warn('unknown topping',k,no);r.top[k]=c?+c:1;});
  const o=ORD[ok];r.text=o[0];let toks=o[1].split('>');
  const hasTop=Object.keys(r.top).length>0;
  if(!hasTop)toks=toks.filter(t=>t!=='토핑');else if(!toks.includes('토핑'))toks.push('토핑');
  r.toks=collapse(toks);
  r.full=(temp&&!/\((HOT|ICE)\)/.test(name)?temp+' ':'')+name;
  r.steam80=/80℃/.test(r.memo);
  return r;
}

function volFor(k,v){if(typeof v!=='number')return mlOf(v)||40;const u=ITEMS[k]?ITEMS[k].u:'ea';return v*({P:9,'래들':12,'청래들':15,ea:6,'스쿱':30,'팩':120,'컵':40,'회':8}[u]||8);}

function mixColors(){const L=B.c.layers;if(L.length<2)return;let prev=0,r=0,g=0,b=0,t=0;L.forEach(l=>{const w=l.f-prev;prev=l.f;const c=l.col.match(/\w\w/g).map(h=>parseInt(h,16));r+=c[0]*w;g+=c[1]*w;b+=c[2]*w;t+=w;});
  const hex=x=>Math.round(x/t).toString(16).padStart(2,'0');B.c.layers=[{f:L[L.length-1].f,col:'#'+hex(r)+hex(g)+hex(b)}];}

function busyMul(){if(!G||G.mode!=='shift')return 1;const n=G.orders.length,late=G.orders.some(o=>o.late);
  return 1+(n>=3?.18:0)+(n>=5?.15:0)+(late?.15:0)+(SAVE.settings.diff==='peak'?.1:0);}
function allBuilds(){return G?G.orders.map(o=>o.build):(B?[B]:[]);}
function jobRunning(kind,b=B){return b&&b.jobs.some(j=>j.kind===kind);}
function startJob(kind,secs,extra={}){B.jobs.push({kind,start:Date.now(),end:Date.now()+secs*1000,...extra});}
function finishJob(b,j){
  const prev=B;B=b;
  if(j.kind==='추출'){if(j.toCup){b.c.shots+=j.n;addVolume(30*j.n,'#5b3416');}else{b.sg.shots+=j.n;b.sg.readyAt=Date.now();}if(b===prev)toast(`☕ ${j.n}샷 추출 완료`);}

  else if(j.kind==='우리기'){b.mc.steeped=true;if(b===prev)toast('🍵 3분 우리기 완료');}
  else if(j.kind==='펄준비'){b.pearl=true;if(b===prev)toast('⚫ 펄 준비 완료');}
  else if(j.kind==='우유거품'){b.froth=true;if(b===prev)toast('☁️ 우유거품 완성');}

function processJobs(){const now=Date.now();let changed=false;

  return changed;}
function jobsStr(b){return (b.jobs||[]).map(j=>`${JOB_LABEL[j.kind]} ${Math.min(99,Math.round((Date.now()-j.start)/(j.end-j.start)*100))}%`).join(' · ');}

function isSubseq(need,have){let i=0;for(const t of have){if(t===need[i])i++;if(i===need.length)return true;}return need.length===0;}
function cmpMap(exp,got){
  const keys=[...new Set([...Object.keys(exp),...Object.keys(got)])];const diffs=[];
  keys.forEach(k=>{const e=exp[k],g=got[k];if(e===undefined)diffs.push(`+ ${k} (넣으면 안 됨)`);else if(g===undefined)diffs.push(`− ${k} 빠짐`);
    else if(String(typeof e==='number'?fmtNum(e):e)!==String(typeof g==='number'?fmtNum(g):g))diffs.push(`${k}: ${typeof g==='number'?fmtNum(g):g} → 정답 ${typeof e==='number'?fmtNum(e):e}`);});
  return diffs;
}
function grade(r,b,extra,type){
  const C=[];const add=(name,ok,exp,got,w)=>C.push({name,ok,exp,got,w});
  add('컵',b.cup===r.cup,CUPS[r.cup],b.cup?CUPS[b.cup]:'없음',1);
  const ns=r.shots+(extra?1:0);
  add('샷',b.c.shots===ns,shotStr(ns)+(extra?' (샷추가)':''),shotStr(b.c.shots),1);
  if(ns&&b.c.deadShot)add('샷 상태',false,`추출 후 ${SHOT_DEAD}초 안에 붓기`,'샷을 너무 오래 방치 (크레마 죽음)',.5);
  const ig=b.c.iceL||b.c.blIceL||'';
  add('얼음',ig===(r.ice||''),r.ice||'없음',ig||'없음',1);
  if(r.liq.some(l=>/^스팀/.test(l.t))){const [lo,hi]=r.steam80?[75,85]:[55,72];const t=b.c.steamTemp;
    add('스팀 온도',t!=null&&t>=lo&&t<=hi,`${lo}~${hi}℃${r.steam80?' (80℃ 메뉴)':''}`,t==null?'스팀 안 함':Math.round(t)+'℃'+(t>hi?' (너무 뜨거움)':t<lo?' (미지근함)':''),.5);}
  const el=r.liq.map(l=>l.t+' '+l.a).sort(),gl=b.c.liq.map(l=>l.t+' '+l.a).sort();
  add('액상',el.join('|')===gl.join('|'),liqStr(r),gl.length?gl.join(' + '):'없음',1.5);
  const di=cmpMap(r.ing,b.c.ing);
  add('재료',!di.length,ingStr(r),di.length?di.join(' / '):'정확',2);
  const dt=cmpMap(r.top,b.c.top);
  add('토핑',!dt.length,topStr(r.top),dt.length?dt.join(' / '):'정확',1);
  if(r.blend||b.blend)add('블렌더',r.blend===b.blend,r.blend?r.blend+' 버튼':'사용 안 함',b.blend?b.blend+' 버튼':'사용 안 함',1);
  const have=collapse(b.tokens);
  add('순서',isSubseq(r.toks,have),r.text,b.log.join(' → ')||'없음',1);
  const left=[];if(b.sg.shots||Object.keys(b.sg.ing).length)left.push('샷잔');if(!blEmpty(b.bl))left.push('블렌더');if(b.mc.liq.length||Object.keys(b.mc.ing).length)left.push('계량컵');
  if((b.jobs||[]).length)left.push('작업 중인 기계');
  add('마무리',!left.length,'남은 재료 없음',left.length?left.join(', ')+'에 재료가 남아있음':'깔끔',.5);
  add('청결',!b.spill,'흘린 곳 없음 (흘렸으면 행주로 닦기)',b.spill?'카운터에 흘린 채로 냄 💦':'깨끗',.5);
  if(type==='포장'||type==='배달'){const need=type==='배달'?'뚜껑 + 캐리어·봉투':'뚜껑';const ok=b.lid&&(type!=='배달'||b.bag);
    add('포장',ok,need,[b.lid?'뚜껑':'',b.bag?'봉투':''].filter(Boolean).join(' + ')||'포장 안 함',.5);}
  const tw=C.reduce((a,c)=>a+c.w,0),gw=C.reduce((a,c)=>a+(c.ok?c.w:0),0);
  let pct=Math.round(gw/tw*100);
  const core=C.filter(c=>['컵','샷','얼음','액상','재료'].includes(c.name)).every(c=>c.ok);
  let verdict=C.every(c=>c.ok)?'perfect':(pct>=80&&core?'ok':(pct>=85?'ok':'fail'));
  if(b.hint&&verdict==='perfect')verdict='ok';
  return {checks:C,pct,verdict};
}

let G=null;
const DIFF={easy:{label:'여유',sec:80,pat:2.4},normal:{label:'보통',sec:62,pat:1.7},peak:{label:'주말 피크',sec:46,pat:1.15}};
function dayName(d){return d%2===1?'토요일':'일요일';}
function unlockedCats(){const d=Math.min(SAVE.day,UNLOCK.length);return UNLOCK.slice(0,d).flat();}
function poolFor(scope,cats,only){
  if(only)return only.map(n=>BYNO[n]);
  let p=RECIPES;
  if(cats&&cats.length)p=p.filter(r=>cats.includes(r.cat));
  else if(scope==='progress')p=p.filter(r=>unlockedCats().includes(r.cat));
  if(scope==='weak'){const w=p.filter(r=>{const s=SAVE.stats[r.no];return !s||s.wrong>0&&s.streak<2;});if(w.length>=3)p=w;}
  return p;
}
function weightedPick(pool,avoid){
  const ws=pool.map(r=>{const s=SAVE.stats[r.no];let w=1;if(!s)w+=1.2;else w+=s.wrong*1.4-Math.min(s.streak,4)*.18;if(r.cat==='에스프레소')w*=.3;if(r.cat==='꿀팁옵션')w*=.5;if(avoid&&r.no===avoid)w*=.1;return Math.max(.15,w);});
  let t=ws.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<pool.length;i++){t-=ws[i];if(t<=0)return pool[i];}return pool[pool.length-1];
}
const TYPES=['매장','매장','매장','포장','포장','배달'];
function makeOrder(rec,group){
  G.num++;const extra=rec.cat==='커피'&&rec.shots>0&&Math.random()<.12;
  const cx=rec.toks.length*6+Object.keys(rec.ing).length*4+Object.keys(rec.top).length*3+rec.liq.length*3;
  const pat=G.mode==='shift'?(45+cx)*DIFF[SAVE.settings.diff].pat:1e9;
  return {id:Math.random().toString(36).slice(2),no:G.num,rec,extra,ani:pick(ANIMALS),fur:pick(FURS),shirt:pick(SHIRTS),type:group?group.type:pick(TYPES),sub:group?group.sub:'',pat,max:pat,late:false,remake:0,build:newBuild(),born:Date.now()};
}
function spawnArrival(){
  const pool=G.pool;const r=weightedPick(pool,G.lastNo);G.lastNo=r.no;
  if(Math.random()<.18&&G.spawnedDrinks+1<G.total){
    const r2=weightedPick(pool,r.no);const type=pick(['포장','배달','매장']);

     mistakes:{},num:Math.floor(Math.random()*30)+10,total:s.n,spawnedDrinks:0,lastNo:0,arrivals:[],events:0,hints:0,times:[],ended:false,pool:poolFor(s.scope)};

  const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
  G.arrivals=Array.from({length:N},()=>{const u=Math.random();let t=u<.4?19*60+gauss()*30:u<.65?20*60+40+gauss()*22:G.start+3+(lastOrder-G.start-3)*Math.random();return clamp(t,G.start+2,lastOrder);}).sort((a,b)=>a-b);
  G.arrivals[0]=G.start+1;G.arrIdx=0;

function serve(){
  const o=activeOrder();if(!o)return toast('주문표에서 음료를 먼저 골라주세요');
  if(!B.cup)return toast('컵이 없어요!','bad');
  if(B.jobs.length)return toast('아직 기계가 돌아가는 중이에요! 끝나고 마무리하세요','bad');
  if(B.spill&&G.mode==='shift'){G.rating=clamp(G.rating-.1,1,5);}
  const res=grade(o.rec,B,o.extra,o.type);const r=o.rec;const usedHint=B.hint;
  const secs=(Date.now()-o.born)/1000;
  record(r.no,res.verdict==='perfect');
  if(res.verdict!=='perfect')G.mistakes[r.no]=(G.mistakes[r.no]||0)+1;
  let money='',line='';
  if(G.mode==='shift'){
    if(res.verdict==='fail'){G.fail++;G.waste++;G.rating=clamp(G.rating-.3,1,5);o.remake++;o.build=newBuild();B=o.build;line=pick(['"이거… 제가 시킨 거 맞아요?"','"맛이 좀 이상한데요?"','"다시 만들어 주실 수 있나요?"']);}
    else{
      G.served++;G.times.push(secs);
      const price=r.price+(o.extra?500:0);G.sales+=price;
      const speed=Math.max(0,o.pat/o.max);
      if(res.verdict==='perfect'){G.perfect++;G.score+=100+Math.round(50*speed);G.rating=clamp(G.rating+.05,1,5);line=pick(['"와 맛있어요! 감사합니다 😊"','"딱 제 스타일이에요!"','"여기 단골할게요~"']);}
      else{G.okc++;G.score+=40;G.rating=clamp(G.rating-.08,1,5);line=pick(['"음… 괜찮네요."','"평소랑 좀 다른데… 뭐 괜찮아요."']);}
      money=`<div class="muted small">매출 +${won(price)}</div>`;
      G.orders=G.orders.filter(x=>x.id!==o.id);
    }
  }else{
    if(res.verdict==='perfect')G.perfect++;else if(res.verdict==='ok')G.okc++;else G.fail++;G.served++;
  }
  if(res.verdict==='perfect')sfx('ok');else sfx('bad');
  const em={perfect:'🤩',ok:'🙂',fail:'😣'}[res.verdict];
  const title={perfect:'완벽해요! 레시피 그대로!',ok:'아쉽지만 통과',fail:'다시 만들어야 해요'}[res.verdict];
  const html=`<div class="verdict"><div class="em">${em}</div><div><b>${title} (${res.pct}점)</b><span class="muted small">${tempBadge(r)} ${esc(r.name)}${o.extra?' · 샷추가':''}${usedHint?' · 💡힌트 사용':''}</span>${line?`<div class="small">${line}</div>`:''}${money}</div></div>
   <div class="checks">${res.checks.map(c=>`<div class="ck ${c.ok?'ok':'bad'}"><span class="m">${c.ok?'✔':'✘'}</span><b>${c.name}</b><div class="d">${c.ok?`<div>${esc(c.name==='순서'?'순서 OK':c.exp)}</div>`:`<div class="ex">정답: ${esc(c.exp)}</div><div class="gt">내가: ${esc(c.got)}</div>`}</div></div>`).join('')}</div>
   <details ${res.verdict==='perfect'?'':'open'}><summary class="small muted" style="cursor:pointer;margin-bottom:6px">📋 레시피 카드 보기</summary>${recCard(r)}</details>
   <div class="row end" style="margin-top:12px">${G.mode==='practice'?`<button class="btn" id="rsRetry">같은 메뉴 다시</button><button class="btn primary" id="rsNext">다음 메뉴 →</button>`:`<button class="btn primary" id="rsNext">${res.verdict==='fail'?'다시 만들기':'다음 손님'}</button>`}</div>`;
  openModal(html,{pause:true,onClose:afterServe});
  $('#rsNext').onclick=()=>closeModal();
  const rt=$('#rsRetry');if(rt)rt.onclick=()=>{G._retry=true;closeModal();};
  renderHud();
}
function afterServe(){
  if(G.mode==='practice'){
    if(G._retry){G._retry=false;const r=G.orders[0].rec;G.orders=[makeOrder(r)];G.orders[0].type='연습';selectOrder(G.orders[0].id);}
    else nextPractice();
    renderHud();return;
  }
  if(!activeOrder()){const n=G.orders[0];G.active=n?n.id:null;B=n?n.build:null;}

/* ---------- main loop ---------- */
let lastT=performance.now(),acc=0;
let jobAcc=0;
function loop(now){
  const dt=Math.min(.5,(now-lastT)/1000);lastT=now;
  if(G&&G.mode==='shift'&&!G.ended&&$('#scr-game').classList.contains('on')&&!(modalOpen()&&modalPauses)&&!G.paused&&!document.hidden){
    if(G.clock<G.close)G.clock=Math.min(G.close,G.clock+dt/G.secPerMin);
    // 손님이 없으면 다음 손님까지 시간 건너뛰기
    if(!G.orders.length&&G.arrIdx<G.arrivals.length&&G.arrivals[G.arrIdx]>G.clock)G.clock=G.arrivals[G.arrIdx];
    while(G.arrIdx<G.arrivals.length&&G.arrivals[G.arrIdx]<=G.clock&&G.spawnedDrinks<G.total){spawnArrival();G.arrIdx++;}
    if(G.arrIdx<G.arrivals.length&&G.spawnedDrinks>=G.total)G.arrIdx=G.arrivals.length;
    if(G.arrIdx>=G.arrivals.length)G.total=G.spawnedDrinks;
    G.orders.forEach(o=>{o.pat-=dt;if(o.pat<=0&&!o.late){o.late=true;G.late++;G.rating=clamp(G.rating-.2,1,5);toast(`#${o.no} 손님: "제 음료 아직이에요?" 😤`,'bad');sfx('bad');renderOrders();}});
    acc+=dt;if(acc>.25){acc=0;tickBars();renderHud();}
    if(G.arrIdx>=G.arrivals.length&&!G.orders.length){G.ended=true;
      const msg=G.clock<G.close?`손님이 끊겼어요. ${clk(G.close)} 마감 시간!`:'마지막 주문 완료!';G.clock=G.close;renderHud();
      openModal(`<h2>🔔 ${msg}</h2><p>이제 마감 청소를 시작해요. 순서가 중요해요!</p><div class="row end"><button class="btn primary" data-close>마감 시작</button></div>`,{pause:true,onClose:()=>startClosing(false)});}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// 기계 작업(추출·블렌더·우리기)은 화면이 안 보여도 계속 진행

  if(!G||!$('#scr-game').classList.contains('on')||(modalOpen()&&modalPauses))return;
  if(processJobs()){renderWork();renderOrders();}
  else if(B&&(B.jobs.length||(B.sg.readyAt&&B.sg.shots))){jobAcc+=.25;if(jobAcc>=.5){jobAcc=0;renderWork();}}
},250);

const STATIONS=[['컵','컵'],['에스프레소','머신'],['얼음','제빙기'],['액상','냉장고'],['재료','시럽·재료'],['스팀','스팀'],['블렌더','블렌더'],['티·도구','티·도구'],['토핑','토핑'],['포장','포장·행주']];
const ST_TITLE={'컵':'컵 꺼내기','에스프레소':'에스프레소 머신','얼음':'제빙기','액상':'냉장고 · 정수기 · 온수기','재료':'시럽 · 파우더 · 베이스','스팀':'스팀 · 우유거품기','블렌더':'블렌더','티·도구':'티 · 도구','토핑':'토핑','포장':'포장 · 행주'};
function stArt(t,size){return `<svg viewBox="0 0 64 60" ${size?`style="width:${size}px;height:${size}px"`:''} aria-hidden="true">${ST_ART[t]}</svg>`;}
function stBadge(t){if(!B)return '';
  const run=k=>B.jobs.find(j=>j.kind===k);
  if(t==='컵'&&B.cup)return `<span class="bdg ok">${CUPS[B.cup].replace('ICE ','')}</span>`;
  if(t==='에스프레소'){if(run('추출'))return '<span class="bdg run">추출 중</span>';if(B.sg.shots){const w=B.sg.readyAt?(Date.now()-B.sg.readyAt)/1000:0;return `<span class="bdg ${w>SHOT_DEAD*.7?'bad':'ok'}">샷 ${B.sg.shots}</span>`;}}
  if(t==='얼음'&&B.c.iceL)return `<span class="bdg ok">${B.c.iceL}</span>`;
  if(t==='스팀'){if(run('우유거품'))return '<span class="bdg run">거품 중</span>';if(B.pit&&!B.pit.used)return `<span class="bdg ok">${Math.round(B.pit.temp)}℃</span>`;}
  if(t==='블렌더'){if(run('믹싱'))return '<span class="bdg run">갈는 중</span>';if(B.bl.mixed)return '<span class="bdg ok">완료</span>';if(!blEmpty(B.bl))return '<span class="bdg">담김</span>';}
  if(t==='티·도구'){if(run('우리기'))return '<span class="bdg run">우리는 중</span>';if(run('펄준비'))return '<span class="bdg run">펄</span>';}
  if(t==='포장'&&B.spill)return '<span class="bdg bad">💦 닦기</span>';
  if(t==='토핑'){const n=Object.values(B.c.top).reduce((a,b)=>a+b,0);if(n)return `<span class="bdg ok">${n}</span>`;}
  return '';}
function renderStations(){const g=$('#stationGrid');if(!g)return;
  g.innerHTML=STATIONS.map(([t,l])=>`<button class="stn" data-stn="${t}">${stBadge(t)}${stArt(t)}<span>${l}</span></button>`).join('');
  g.querySelectorAll('[data-stn]').forEach(b=>b.onclick=()=>{if(!B)return toast('손님을 먼저 눌러 주문을 골라요');openStation(b.dataset.stn);});}
function openStation(t){if(!B)return;B.tab=t;
  openModal(`<div class="st-head">${stArt(t,44)}<h3>${ST_TITLE[t]}</h3><button class="btn ghost" data-close aria-label="닫기">✕</button></div><div id="panel"></div>`,{sheet:true,pause:false});
  renderPanel();}

function vesselHtml(name,icon,content,targetable){
  const on=B.target===name;
  return `<button class="vessel ${on?'target':''} ${targetable?'':'info'}" ${targetable?`data-tg="${name}"`:''}><span class="vi">${icon}</span><span><b>${name} ${on?'<span class="tgt">◀ 넣을 곳</span>':''}</b><span class="vc">${content||'비어있음'}</span></span></button>`;
}
function contentStr(v){const p=[];if(v.shots)p.push(v.shots+'샷');Object.keys(v.ing||{}).forEach(k=>p.push(itemStr(k,v.ing[k])));(v.liq||[]).forEach(l=>p.push(l.t+' '+l.a));if(v.iceF)p.push('얼음 '+v.iceL);if(v.mixed)p.push('✓믹싱');if(v.steeped)p.push('✓우림');
  if(v.readyAt&&v.shots){const w=Math.round((Date.now()-v.readyAt)/1000);p.push(w>SHOT_DEAD?`⚠ ${w}초 방치`:`⏱ ${w}초`);}return p.join(', ');}
function renderWork(){
  const o=G?activeOrder():null;
  if(!o||!B){$('#nowMaking').innerHTML='<span class="muted">주문표에서 만들 음료를 골라주세요</span>';$('#vessels').innerHTML='';$('#log').innerHTML='';$('#logCount').textContent='';drawCup();renderStations();return;}
  const r=o.rec;
  $('#nowMaking').innerHTML=`<span class="small muted">지금 제조</span> ${tempBadge(r)} <span class="nm">${esc(r.name)}</span>${o.extra?'<span class="badge red">+샷추가</span>':''}<span class="badge tag">${o.type}</span>`;
  const cupC=B.cup?[B.c.shots?B.c.shots+'샷':'',...Object.keys(B.c.ing).map(k=>itemStr(k,B.c.ing[k])),...B.c.liq.map(l=>l.t+' '+l.a),B.c.iceL?'얼음 '+B.c.iceL:'',B.c.blIceL?'(블렌더 얼음 '+B.c.blIceL+')':'',B.lid?'🔒뚜껑':'',B.bag?'🛍봉투':'',...Object.keys(B.c.top).map(k=>'🍒'+k+(B.c.top[k]>1?'×'+B.c.top[k]:''))].filter(Boolean).join(', '):'컵 없음';
  let h=vesselHtml('컵',TGT_ICON['컵'],(B.cup?`<b>${CUPS[B.cup]}</b> `:'')+esc(cupC),true)+
    vesselHtml('샷잔',TGT_ICON['샷잔'],esc(contentStr(B.sg)),true)+
    vesselHtml('블렌더',TGT_ICON['블렌더'],esc(contentStr(B.bl)),true)+
    vesselHtml('계량컵',TGT_ICON['계량컵'],esc(contentStr(B.mc)),true);
  if(B.pit||B.froth)h+=`<div class="vessel info"><span class="vi">🥛</span><span><b>스팀피처 / 거품기</b><span class="vc">${B.pit?`${B.pit.m} ${B.pit.used?'(부음)':B.pit.ml+' · '+Math.round(B.pit.temp)+'℃'}`:'—'}${B.froth?' · 우유거품 준비됨':''}</span></span></div>`;
  if(B.jobs.length)h+=`<div class="vessel info jobs"><span class="vi">⏳</span><span><b>기계 작동 중</b><span class="vc" id="jobLine">${jobsStr(B)}</span></span></div>`;
  if(B.spill)h+=`<button class="vessel info spill" data-wipe><span class="vi">💦</span><span><b>카운터에 흘렸어요!</b><span class="vc">눌러서 행주로 닦기</span></span></button>`;
  $('#vessels').innerHTML=h;
  $('#vessels').querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>setTarget(b.dataset.tg));
  const wp=$('#vessels [data-wipe]');if(wp)wp.onclick=()=>doWipe();
  $('#log').innerHTML=B.log.length?B.log.map((t,i)=>`<span class="lg"><i>${i+1}</i>${esc(t)}</span>`).join(''):'<span class="muted small">아직 아무것도 안 했어요</span>';
  $('#logCount').textContent=B.log.length?`(${B.log.length})`:'';
  drawCup();renderPanel();
}

/* ---------- cup SVG ---------- */
function drawCup(){
  const svg=$('#cupSvg');
  if(!B||!B.cup){svg.innerHTML=`<rect x="10" y="232" width="180" height="10" rx="4" fill="#a37c55" opacity=".35"/><text x="100" y="140" text-anchor="middle" font-size="14" fill="currentColor" opacity=".45">컵을 꺼내주세요</text>`;return;}
  const g={HOT:{top:70,tw:128,bw:96},ESP:{top:160,tw:70,bw:54},'20':{top:58,tw:140,bw:102},'24':{top:38,tw:146,bw:104},'32':{top:14,tw:152,bw:106}}[B.cup];
  const bot=232,h=bot-g.top,cx=100;
  const X=(f,side)=>{const w=g.bw+(g.tw-g.bw)*f;return cx+side*w/2;};
  const Y=f=>bot-f*h;
  const poly=`${X(1,-1)},${g.top} ${X(1,1)},${g.top} ${X(0,1)},${bot} ${X(0,-1)},${bot}`;
  let s=`<defs><clipPath id="cc"><polygon points="${poly}"/></clipPath></defs><rect x="10" y="232" width="180" height="10" rx="4" fill="#a37c55" opacity=".35"/>`;
  s+=`<g clip-path="url(#cc)">`;
  let prev=0;B.c.layers.forEach(l=>{s+=`<rect x="0" y="${Y(l.f)}" width="200" height="${Y(prev)-Y(l.f)}" fill="${l.col}"/>`;prev=l.f;});
  if(B.c.iceF){const fi=Math.min(1,B.c.iceF);let k=0;for(let yy=bot-16;yy>Y(fi);yy-=17){for(let xx=X(0,-1)-10;xx<X(1,1);xx+=19){const jx=((k*37)%7)-3;k++;s+=`<rect x="${xx+jx+(yy%2?6:0)}" y="${yy-2}" width="15" height="15" rx="3" fill="#e8f5ff" fill-opacity=".55" stroke="#8fc3e6" stroke-opacity=".9"/>`;}}}
  s+=`</g>`;
  s+=`<polygon points="${poly}" fill="${B.cup==='HOT'||B.cup==='ESP'?'none':'rgba(255,255,255,.12)'}" stroke="currentColor" stroke-opacity=".55" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(B.cup==='HOT'){s+=`<polygon points="${X(.62,-1)},${Y(.62)} ${X(.62,1)},${Y(.62)} ${X(.3,1)},${Y(.3)} ${X(.3,-1)},${Y(.3)}" fill="#b98a5a" opacity=".55"/>`;}
  if(B.cup==='ESP'){s+=`<path d="M${X(.7,1)},${Y(.75)} q22,4 4,30" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="5"/>`;}
  (SHOW_LINES[B.cup]||[]).forEach(n=>{const f=LINE_F[B.cup][n];const y=Y(f);s+=`<line x1="${X(f,1)-16}" y1="${y}" x2="${X(f,1)-2}" y2="${y}" stroke="#2a64c9" stroke-width="2"/>`;
    if(SAVE.settings.lines||G&&G.mode==='practice')s+=`<text x="${X(f,1)+3}" y="${y+4}" font-size="10" fill="#2a64c9" font-weight="700">${n}</text>`;});
  // toppings
  const tf=topF(),ty=Y(Math.max(tf,.05));const T=B.c.top;
  if(T['일반휘핑'])s+=`<path d="M${X(1,-1)+12},${g.top+2} q${(g.tw-24)/2},-46 ${g.tw-24},0 z" fill="#fffaf2" stroke="#e8dcc6"/>`;
  const topY=T['일반휘핑']?g.top-14:ty;
  if(T['카라멜드리즐']||T['초코드리즐']){const c=T['초코드리즐']?'#4a2414':'#b56a1c';s+=`<path d="M${cx-34},${topY} l10,-6 l10,6 l10,-6 l10,6 l10,-6 l10,6 l10,-6" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;}
  if(T['애플민트']||T['로즈마리'])s+=`<ellipse cx="${cx+18}" cy="${topY-6}" rx="9" ry="5" fill="#3f9b45" transform="rotate(-25 ${cx+18} ${topY-6})"/><ellipse cx="${cx+28}" cy="${topY-8}" rx="8" ry="4" fill="#52b058" transform="rotate(25 ${cx+28} ${topY-8})"/>`;
  ['레몬슬라이스','자몽슬라이스'].forEach((k,i)=>{if(T[k])s+=`<circle cx="${cx-20+i*12}" cy="${topY-4}" r="10" fill="${i?'#f39a7e':'#f6dc58'}" stroke="#fff" stroke-width="2"/>`;});
  ['시나몬파우더','코코아파우더','녹차파우더','아몬드슬라이스','쿠키분태','딸기분태','코코넛칩','죠리퐁 가득','허니퍼프시리얼 가득','에스프레소 큐브','오레오','오레오(컷팅)','초코젤라또','식힌 샷','티백'].forEach((k,i)=>{if(T[k]){const c=colOf(k);for(let j=0;j<6;j++)s+=`<circle cx="${cx-30+((i*13+j*11)%60)}" cy="${topY-3-(j%3)*3}" r="${k.includes('가득')||k.includes('큐브')||k.includes('젤라또')?5:2.5}" fill="${c}"/>`;}});
  svg.innerHTML=s;
}

/* =====================================================================
   MINIGAMES — 붓기(홀드) · 펌프 · 래들 · 얼음 스쿱 · 스팀

const TOL={easy:{line:.05,ml:15},normal:{line:.035,ml:10},peak:{line:.028,ml:8}};
function tol(){return TOL[G&&G.mode==='shift'?SAVE.settings.diff:'normal'];}
function showLabels(){return SAVE.settings.lines||(G&&G.mode==='practice');}
const JUDGE_LINES={HOT:['가득','9부','8부'],ESP:['가득'],'20':['가득','8부','A선','B선','C선','D선','컵밑선'],'24':['가득','9부','8.5부','Z선','컵밑선'],'32':['가득','9부','I선','컵밑선']};
function judgeLine(cup,f){let best=null,bd=9;(JUDGE_LINES[cup]||JUDGE_LINES['20']).forEach(n=>{const d=Math.abs(lineFrac(cup,n)-f);if(d<bd){bd=d;best=n;}});
  if(bd<=tol().line)return best;return `${best}보다 ${f>lineFrac(cup,best)?'많음':'적음'}`;}
function judgeMl(v,unit){const step=unit==='g'?10:25,t=unit==='g'?4:tol().ml;const n=Math.round(v/step)*step;return Math.abs(v-n)<=t&&n>0?n+unit:`${Math.round(v)}${unit}(어중간)`;}
function judgeIce(f,tg){if(f<.38)return '조금';if(f<.6)return '반컵';if(f<.74)return '컵선';if(f<.87)return '8부';if(tg==='블렌더'&&f>=1.07)return '가득+컵밑선';return '가득';}

function cupGeom(cup){return {HOT:{top:70,tw:128,bw:96},ESP:{top:160,tw:70,bw:54},'20':{top:58,tw:140,bw:102},'24':{top:38,tw:146,bw:104},'32':{top:14,tw:152,bw:106}}[cup];}
function miniCup(cup,{level=0,col='#cfe6f5',iceF=0,foam=0,base=null}={}){
  const g=cupGeom(cup),bot=232,h=bot-g.top,cx=100;const X=(f,s)=>cx+s*(g.bw+(g.tw-g.bw)*Math.min(f,1))/2;const Y=f=>bot-f*h;
  const poly=`${X(1,-1)},${g.top} ${X(1,1)},${g.top} ${X(0,1)},${bot} ${X(0,-1)},${bot}`;
  let s=`<defs><clipPath id="mcc"><polygon points="${poly}"/></clipPath></defs><g clip-path="url(#mcc)">`;
  if(base&&base.f>0)s+=`<rect x="0" y="${Y(base.f)}" width="200" height="${Y(0)-Y(base.f)}" fill="${base.col}"/>`;
  if(level>(base?base.f:0))s+=`<rect x="0" y="${Y(level)}" width="200" height="${Y(base?base.f:0)-Y(level)}" fill="${col}"/>`;
  if(foam>0)s+=`<rect x="0" y="${Y(level+foam)}" width="200" height="${Y(level)-Y(level+foam)}" fill="#ffffff" opacity=".85"/>`;
  if(iceF){let k=0;for(let yy=bot-16;yy>Y(Math.min(iceF,1));yy-=17){for(let xx=X(0,-1)-10;xx<X(1,1);xx+=19){const jx=((k*37)%7)-3;k++;s+=`<rect x="${xx+jx+(yy%2?6:0)}" y="${yy-2}" width="15" height="15" rx="3" fill="#e8f5ff" fill-opacity=".55" stroke="#8fc3e6" stroke-opacity=".9"/>`;}}}
  if(level>0.01)s+=`<rect x="0" y="${Y(level)-1.5}" width="200" height="3" fill="${col}"/><line x1="0" x2="200" y1="${Y(level)}" y2="${Y(level)}" stroke="#1d4f9a" stroke-width="1.6" opacity=".55"/>`;
  s+=`</g>`;
  if(iceF>1){const hy=Y(1),hh=(iceF-1)*h;for(let i=0;i<6;i++)s+=`<rect x="${cx-40+i*14}" y="${hy-hh*(1-Math.abs(i-2.5)/4)-4}" width="13" height="13" rx="3" fill="#eaf6ff" stroke="#9cc9e8"/>`;}
  s+=`<polygon points="${poly}" fill="none" stroke="currentColor" stroke-opacity=".6" stroke-width="2.5" stroke-linejoin="round"/>`;
  (JUDGE_LINES[cup]||[]).filter(n=>n!=='가득'&&(cup!=='HOT'||showLabels())).forEach(n=>{const f=lineFrac(cup,n),y=Y(f);
    s+=`<line x1="${X(f,1)-18}" y1="${y}" x2="${X(f,1)-2}" y2="${y}" stroke="#2a64c9" stroke-width="2" ${cup==='HOT'?'stroke-dasharray="3 3"':''}/>`;
    if(showLabels())s+=`<text x="${X(f,1)+3}" y="${y+4}" font-size="10" fill="#2a64c9" font-weight="700">${n}</text>`;});
  return s;
}
function miniPitcher(v,max,col,unit){
  if(unit==='g'){return `<rect x="30" y="150" width="140" height="70" rx="10" fill="#555"/><rect x="45" y="165" width="110" height="38" rx="5" fill="#cfe9c8"/><text x="100" y="193" text-anchor="middle" font-size="26" font-family="monospace" font-weight="700" fill="#173">${v.toFixed(0)} g</text>
   <ellipse cx="100" cy="140" rx="55" ry="10" fill="#ddd"/><rect x="60" y="${140-Math.min(60,v*.6)}" width="80" height="${Math.min(60,v*.6)}" fill="${col}" opacity=".9" rx="6"/>`;}
  const top=30,bot=230,h=bot-top,Y=x=>bot-x/max*h;
  let s=`<rect x="55" y="${top}" width="90" height="${h}" rx="6" fill="rgba(255,255,255,.25)" stroke="currentColor" stroke-opacity=".55" stroke-width="2.5"/>`;
  s+=`<rect x="57" y="${Y(v)}" width="86" height="${Math.max(0,bot-Y(v)-2)}" fill="${col}" opacity=".9"/>`;
  for(let x=25;x<max;x+=25){const y=Y(x);const big=x%100===0,mid=x%50===0;s+=`<line x1="${145-(big?22:mid?14:7)}" y1="${y}" x2="145" y2="${y}" stroke="#2a64c9" stroke-width="${big?2:1.2}"/>`;if(big)s+=`<text x="150" y="${y+4}" font-size="11" fill="#2a64c9" font-weight="700">${x}</text>`;else if(mid)s+=`<text x="150" y="${y+3}" font-size="8" fill="#2a64c9" opacity=".8">${x}</text>`;}
  return s;
}

let MG=null,mgRAF=0;
function mgOpen(st,html){
  MG=st;st.last=performance.now();
  openModal(html,{sheet:true,pause:false,onClose:()=>{MG=null;cancelAnimationFrame(mgRAF);}});
  const hb=$('#mgHold');if(hb&&st.press)bindHold(hb);
  cancelAnimationFrame(mgRAF);mgRAF=requestAnimationFrame(mgTick);
}
function mgTick(now){if(!MG)return;const dt=Math.min(.05,(now-MG.last)/1000);MG.last=now;if(MG.update)MG.update(dt);if(MG.draw)MG.draw();mgRAF=requestAnimationFrame(mgTick);}
function bindHold(el){
  el.addEventListener('pointerdown',e=>{e.preventDefault();if(!MG)return;try{el.setPointerCapture(e.pointerId);}catch(_){}if(!MG.pressing)MG.press(true);el.classList.add('down');});
  const up=()=>{el.classList.remove('down');if(MG&&MG.pressing)MG.press(false);};
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,up));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
document.addEventListener('keydown',e=>{if(MG&&MG.press&&e.code==='Space'){e.preventDefault();if(!e.repeat&&!MG.pressing){MG.press(true);const h=$('#mgHold');if(h)h.classList.add('down');}}});
document.addEventListener('keyup',e=>{if(MG&&MG.press&&e.code==='Space'){e.preventDefault();const h=$('#mgHold');if(h)h.classList.remove('down');if(MG.pressing)MG.press(false);}});
function mgFinish(){const m=MG;closeModal();if(m&&m.commit)m.commit();}

function pourGame(o){
  const st={type:'pour',mode:o.modes[0],pressing:false,poured:false,spilled:false,foam:0,ml:0};
  const baseF=o.tg==='컵'?topF():0,baseCol=B.c.layers.length?B.c.layers[B.c.layers.length-1].col:'#ccc';st.level=baseF;
  const mul=busyMul(),iceK=(o.tg==='컵'&&B.c.iceF)?1.45:1;
  st.press=p=>{st.pressing=p;if(p)st.poured=true;const mt=$('#mgModes');if(mt&&st.poured)mt.style.display='none';const c=$('#mgCancel');if(c&&st.poured)c.textContent='—';};
  st.update=dt=>{
    if(st.mode==='line'){
      if(st.pressing){st.level+=.23*mul*iceK*dt;if(o.carb)st.foam=Math.min(.11,st.foam+dt*.3);}else st.foam=Math.max(0,st.foam-dt*.06);
      if(st.level+st.foam>1.0){if(!st.spilled){st.spilled=true;markSpill(o.name);}st.level=Math.min(st.level,1);st.foam=Math.max(0,Math.min(st.foam,1-st.level));}
    }else{
      if(st.pressing)st.ml+=(o.unit==='g'?22:95)*mul*dt;
      if(st.ml>o.max){if(!st.spilled){st.spilled=true;markSpill(o.name);}st.ml=o.max;}
    }};
  st.draw=()=>{const svg=$('#mgSvg');if(!svg)return;
    if(st.mode==='line')svg.innerHTML=miniCup(B.cup,{level:st.level,col:o.col,iceF:o.tg==='컵'?B.c.iceF:0,foam:st.foam,base:{f:baseF,col:baseCol}});
    else svg.innerHTML=miniPitcher(st.ml,o.max,o.col,o.unit);
    const rd=$('#mgRead');if(rd)rd.textContent=st.mode==='ml'&&o.unit!=='g'&&!showLabels()?'눈금을 보고 맞추세요':st.mode==='ml'?`${Math.round(st.ml)}${o.unit}`:(o.carb&&st.foam>.02?'🫧 거품 올라오는 중…':'');};
  st.commit=()=>{if(!st.poured)return;
    if(st.mode==='line'){o.onDone(judgeLine(B.cup,st.level),{level:st.level});}
    else o.onDone(judgeMl(st.ml,o.unit),{ml:st.ml});};
  const modeName={line:'📏 컵 라인까지 붓기',ml:o.unit==='g'?'⚖️ 저울로 계량':'🧪 계량해서 붓기 (ml)'};
  mgOpen(st,`<h3>${esc(o.title)}</h3><p class="muted small" style="margin:0 0 6px">${esc(o.sub||'버튼을 누르고 있으면 부어져요. 원하는 선/눈금에서 손을 떼세요!')}</p>
   ${o.modes.length>1?`<div class="chips" id="mgModes">${o.modes.map(m=>`<button class="chip ${m===st.mode?'on':''}" data-mm="${m}">${modeName[m]}</button>`).join('')}</div>`:''}
   <div class="mg-stage"><svg id="mgSvg" viewBox="0 0 200 250"></svg><div class="mg-read" id="mgRead"></div></div>
   <button class="hold" id="mgHold">👇 꾹 누르고 있기 = 붓기<small>(PC는 스페이스바)</small></button>
   <div class="row end" style="margin-top:8px"><button class="btn ghost" id="mgCancel">취소</button><button class="btn primary" id="mgDone">완료</button></div>`);
  $('#modalBox').querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{if(st.poured)return;st.mode=b.dataset.mm;st.level=baseF;st.ml=0;$('#modalBox').querySelectorAll('[data-mm]').forEach(x=>x.classList.toggle('on',x===b));});
  $('#mgCancel').onclick=()=>{if(st.poured)return toast('이미 부었어요! 완료를 눌러요');closeModal();};
  $('#mgDone').onclick=()=>mgFinish();
}

function pumpGame(k,onDone){

  st.tap=add;
  st.update=dt=>{st.anim=Math.max(0,st.anim-dt*4);st.stroke=st.anim>.5?(1-st.anim)*2:st.anim*2;};
  st.draw=()=>{const svg=$('#mgSvg');if(!svg)return;const d=st.stroke*34;const col=colOf(k);
    svg.innerHTML=`<rect x="70" y="${88+d}" width="60" height="12" rx="4" fill="#333"/><rect x="95" y="${60+d}" width="10" height="34" fill="#555"/><rect x="128" y="${92+d}" width="38" height="8" rx="3" fill="#333"/>
     <rect x="96" y="100" width="8" height="${30}" fill="#777"/><rect x="58" y="128" width="84" height="104" rx="14" fill="${col}" opacity=".9" stroke="currentColor" stroke-opacity=".4"/>
     <text x="100" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#2a1c12">${esc(k.length>7?k.slice(0,7)+'…':k)}</text>
     ${st.pressing&&st.stroke>=.9?`<circle cx="166" cy="${110+d}" r="5" fill="${col}"/>`:''}
     <rect x="20" y="230" width="${st.stroke*160}" height="6" rx="3" fill="${st.stroke>=.9?'#23945a':st.stroke>=.4?'#d98a0b':'#d23f3f'}"/>`;
    const rd=$('#mgRead');if(rd)rd.innerHTML=`<b style="font-size:1.6em">${fmtNum(st.total)} P</b>`;};
  st.commit=()=>{if(st.total>0)onDone(st.total);};

  $('#mgP1').onclick=()=>add(1);$('#mgP5').onclick=()=>add(.5);
  $('#mgUndoP').onclick=()=>{const v=st.strokes.pop();if(v){st.total-=v;const L=$('#mgStrokes');if(L)L.innerHTML=st.strokes.map(a=>`<span class="chip">${a===1?'1P':'½P'}</span>`).join('');}};

function pourPick(o){
  const cup=B.cup;const inCup=o.tg==='컵'&&cup;const baseF=inCup?topF():0;const baseCol=B.c.layers.length?B.c.layers[B.c.layers.length-1].col:'#ccc';
  const isLine=v=>!/\d/.test(v)&&inCup&&lineFrac(cup,v)!=null;
  const opts=o.opts;const lineOpts=opts.filter(isLine),mlOpts=opts.filter(v=>!isLine(v));
  let busy=false;
  const draw=lv=>{const s=$('#mgSvg');if(s&&inCup)s.innerHTML=miniCup(cup,{level:lv,col:o.col,iceF:B.c.iceF,base:{f:baseF,col:baseCol}});};
  openModal(`<h3>${esc(o.title)}</h3><p class="muted small" style="margin:0 0 6px">${esc(o.sub||'어디까지 / 얼마나 넣을지 고르면 부어줘요')}</p>
   ${inCup?'<div class="mg-stage"><svg id="mgSvg" viewBox="0 0 200 250"></svg></div>':''}
   ${lineOpts.length?`<div class="sg-label">📏 컵 선까지</div><div class="chips">${lineOpts.map(v=>`<button class="chip big" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`:''}
   ${mlOpts.length?`<div class="sg-label">🧪 계량해서 ${o.unit==='g'?'(저울)':'(ml)'}</div><div class="chips">${mlOpts.map(v=>`<button class="chip big" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`:''}
   <div class="row end" style="margin-top:10px"><button class="btn ghost" data-close>취소</button></div>`,{sheet:true,pause:false});
  draw(baseF);
  $('#modalBox').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(busy)return;busy=true;const v=b.dataset.v;b.classList.add('on');
    const line=isLine(v),ml=mlOf(v);
    const finish=()=>{closeModal();o.onDone(v,line?{level:lineFrac(cup,v)}:{ml});};
    if(!inCup)return finish();
    const to=line?Math.max(lineFrac(cup,v),baseF):Math.min(1,baseF+(ml||100)/(CAP[cup]||600)*(B.c.iceF?1.8:1));
    const t0=performance.now();const step=now=>{const p=Math.min(1,(now-t0)/500);draw(baseF+(to-baseF)*p);if(p<1&&busy)requestAnimationFrame(step);};requestAnimationFrame(step);
    setTimeout(finish,560);});
}

let CL=null;
function startClosing(practiceOnly){
  CL={tasks:shuffle(CLOSE_TASKS.map((t,i)=>({...t,i,done:false}))),warn:0,quizOk:0,quizN:0,practice:practiceOnly,busy:false};
  show('close');renderClosing();
}
function renderClosing(){
  const left=CL.tasks.filter(t=>!t.done).length;
  const cur=Math.min(...CL.tasks.filter(t=>!t.done).map(t=>t.p).concat([9]));
  $('#closeRoot').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">🧹 마감 ${G&&G.mode==='shift'&&!CL.practice?`· ${dayName(G.day)} ${clk(G.close)}`:'연습'}</h2><button class="btn" id="clQuit">${CL.practice?'← 메인':'건너뛰기'}</button></div>
   <p class="muted small">순서가 있는 일이에요! 앞 단계가 남아있는데 뒷 단계를 하면 경고가 쌓여요. 남은 일 ${left}개 · 경고 ${CL.warn}회</p>
   <div class="pbar2"><i style="width:${(1-left/CL.tasks.length)*100}%"></i></div>
   <p class="small">지금 단계 힌트: <b>${cur<9?PHASES[cur]:'완료!'}</b> ${SAVE.settings.diff==='peak'?'':''}</p>
   <div class="task-list">${CL.tasks.map((t,k)=>`<button class="task ${t.done?'done':''}" data-k="${k}"><span class="tk">${t.done?'✓':''}</span><span>${esc(t.t)}${t.done?`<br><span class="muted small">${PHASES[t.p]}</span>`:''}</span><span class="prog"></span></button>`).join('')}</div>

  $('#clQuit').onclick=()=>{if(CL.practice)goHome();else finishClosing();};
  document.querySelectorAll('.task').forEach(b=>b.onclick=()=>doTask(+b.dataset.k,b));
}
function doTask(k,el){
  const t=CL.tasks[k];if(t.done||CL.busy)return;
  const cur=Math.min(...CL.tasks.filter(x=>!x.done).map(x=>x.p));
  if(t.p>cur){CL.warn++;sfx('bad');toast(`⚠ 아직 '${PHASES[cur]}' 단계 일이 남았어요!`,'bad');renderClosing();return;}
  CL.busy=true;el.classList.add('doing');
  setTimeout(()=>{CL.busy=false;t.done=true;
    const after=()=>{renderClosing();if(CL.tasks.every(x=>x.done))setTimeout(finishClosing,400);};
    if(t.quiz==='expiry'){expiryQuiz(2,after);}else if(t.quiz==='mint'){quizModal(STATIC_EV[3],ok=>{CL.quizN++;if(ok)CL.quizOk++;after();});}else after();
  },700);
}
function expiryQuiz(n,done){
  if(n<=0)return done();
  const b=pick(BASES.slice(0,11));const life=b[5];let ago,ok;
  if(life===1){ago=pick([26,30,20,10]);ok=ago<24;}
  else{const good=Math.random()<.5;ago=good?Math.max(0,life-1-Math.floor(Math.random()*2)):life+1+Math.floor(Math.random()*2);ok=good;}
  const lbl=life===1?`${ago}시간 전 제조`:`${ago===0?'오늘':ago+'일 전'} 제조`;
  const ev={title:'🏷 라벨 확인',q:`[${b[0]}] 라벨: ${lbl}. 어떻게 할까요?`,opts:['계속 사용','폐기'],ans:ok?'계속 사용':'폐기',exp:`${b[0]} 안전보관일: ${b[4]}`};
  quizModal(ev,r=>{CL.quizN++;if(r)CL.quizOk++;expiryQuiz(n-1,done);});
}
function finishClosing(){
  if(CL.practice||!G||G.mode!=='shift'){const sc=Math.max(0,100-CL.warn*10);
    $('#closeRoot').innerHTML=`<div class="card" style="text-align:center"><h2>🧹 마감 연습 끝!</h2><div class="grade">${sc}</div><p>경고 ${CL.warn}회 · 보관기한 퀴즈 ${CL.quizOk}/${CL.quizN}</p>${closeOrderHtml()}<div class="row" style="justify-content:center"><button class="btn primary" id="clAgain">다시</button><button class="btn" data-home2>메인</button></div></div>`;
    $('#clAgain').onclick=()=>startClosing(true);document.querySelector('[data-home2]').onclick=()=>goHome();return;}
  showSummary();
}
function closeOrderHtml(){return `<div style="text-align:left;margin:12px 0"><b class="small">마감 순서 정리</b>${PHASES.map((p,i)=>`<div class="small" style="margin-top:6px"><b>${i+1}. ${p}</b> — ${CLOSE_TASKS.filter(t=>t.p===i).map(t=>t.t).join(' / ')}</div>`).join('')}</div>`;}

function showSummary(){
  const total=G.perfect+G.okc+G.fail;const acc=total?Math.round(G.perfect/total*100):0;
  const avg=G.times.length?Math.round(G.times.reduce((a,b)=>a+b,0)/G.times.length):0;
  const closeScore=Math.max(0,100-CL.warn*10)+CL.quizOk*10;
  const score=G.score+closeScore+Math.round(G.rating*20)-G.late*20;
  const gr=acc>=90&&G.rating>=4.5?'S':acc>=75&&G.rating>=4?'A':acc>=55?'B':'C';
  const pass=gr!=='C';
  SAVE.shifts++;SAVE.best=Math.max(SAVE.best,score);
  const unlockedBefore=unlockedCats().length;
  if(pass)SAVE.day++;persist();
  const newCats=unlockedCats().length>unlockedBefore?UNLOCK[Math.min(SAVE.day,UNLOCK.length)-1]:null;
  const mis=Object.entries(G.mistakes).sort((a,b)=>b[1]-a[1]);
  $('#sumRoot').innerHTML=`<div class="card"><div class="row" style="gap:16px"><div class="grade">${gr}</div><div><h2 style="margin:0">${dayName(G.day)} 마감 끝! 수고했어요 🙌</h2><div class="muted">${G.day}일차 근무 기록 · 점수 ${score.toLocaleString()}</div></div></div>
   <div class="sumgrid">
    <div class="stat"><small>매출</small><b>${won(G.sales)}</b></div>
    <div class="stat"><small>제조 잔수</small><b>${G.served}잔</b></div>
    <div class="stat"><small>레시피 정확도</small><b>${acc}%</b></div>
    <div class="stat"><small>평판</small><b>★${G.rating.toFixed(1)}</b></div>
    <div class="stat"><small>평균 제조시간</small><b>${avg}초</b></div>
    <div class="stat"><small>지연/재제조/폐기</small><b>${G.late} / ${G.fail} / ${Math.round(G.waste)}</b></div>
    <div class="stat"><small>흘린 횟수 💦</small><b>${G.spills||0}회</b></div>
    <div class="stat"><small>돌발 퀴즈</small><b>${G.events}회</b></div>
    <div class="stat"><small>마감 경고</small><b>${CL.warn}회</b></div>
   </div>
   ${pass?`<p>✅ 점장님 평가 통과! 다음은 <b>${SAVE.day}일차 (${dayName(SAVE.day)})</b>${newCats?` — 새 메뉴 해금: <b>${newCats.join(', ')}</b>`:''}</p>`:`<p>😅 아직 C등급… 같은 일차를 한 번 더 해봐요. 틀린 메뉴부터 복습!</p>`}
   ${mis.length?`<h3>틀린 메뉴</h3><div class="bk-list">${mis.map(([no,c])=>{const r=BYNO[no];return `<button class="bk-item" data-rno="${no}">${tempBadge(r)} ${esc(r.name)}<span class="p">${c}회</span></button>`}).join('')}</div>`:'<p>🎉 틀린 메뉴 없음!</p>'}
   ${closeOrderHtml()}
   <div class="row end" style="margin-top:14px">${mis.length?'<button class="btn" id="smReview">🧪 틀린 메뉴 복습</button>':''}<button class="btn" id="smHome">메인으로</button><button class="btn primary" id="smNext">다음 근무 →</button></div></div>`;
  show('summary');
  document.querySelectorAll('[data-rno]').forEach(b=>b.onclick=()=>showRecipe(BYNO[b.dataset.rno],true));

}

let QZ=null;
function uniqOpts(ans,cands,n=3){const out=[];shuffle(cands).forEach(c=>{if(c!==ans&&!out.includes(c)&&out.length<n)out.push(c);});return out.length===n?shuffle([ans,...out]):null;}
function summaryOf(r){return `${CUPS[r.cup]} · ${shotStr(r.shots)} · 얼음 ${r.ice||'없음'}${r.blend?' · 블렌더 '+r.blend:''} · 액상 ${liqStr(r)} · 재료 ${ingStr(r)} · 토핑 ${topStr(r.top)}`;}
function makeQ(t,r,pool){
  const nm=`${r.temp?r.temp+' ':''}${r.name}`;
  if(t==='cup'){const ans=CUPS[r.cup];return {r,q:`${nm} — 컵은?`,opts:shuffle(['HOT컵','ICE 20oz','ICE 24oz','ICE 32oz']),ans};}
  if(t==='shots')return {r,q:`${nm} — 샷은 몇 샷?`,opts:['샷 없음','1샷','2샷','3샷'],ans:r.shots?r.shots+'샷':'샷 없음'};
  if(t==='ice'){const all=['얼음 없음','반컵','컵선','8부','가득','가득+컵밑선'];const ans=r.ice||'얼음 없음';const o=uniqOpts(ans,all);return o&&{r,q:`${nm} — 얼음 양은?`,opts:o,ans};}
  if(t==='blend'){return {r,q:`${nm} — 블렌더 버튼은?`,opts:['블렌더 안 씀','1번','3번','3번(5초)'],ans:r.blend||'블렌더 안 씀'};}
  if(t==='liq'){const ans=liqStr(r);const l=r.liq[0];const pool2=(LINES.includes(l.a)?LINES:MLS).filter(v=>v!==l.a);
    const cands=shuffle(pool2).slice(0,6).map(v=>liqStr({liq:[{...l,a:v,n:''},...r.liq.slice(1)]}));
    const o=uniqOpts(ans,cands);return o&&{r,q:`${nm} — 액상은?`,opts:o,ans};}
  if(t==='ing'){const ks=Object.keys(r.ing);if(!ks.length)return null;const k=pick(ks);const v=r.ing[k];const it=ITEMS[k];
    const ans=itemStr(k,v,r.ingN[k]);let cands;
    if(typeof v==='number'){const st=it.u==='P'?[.5,1,2,-1,3,-.5]:[1,2,-1,3,-2];cands=st.map(d=>v+d).filter(x=>x>0).map(x=>itemStr(k,x));}
    else cands=it.opts.filter(o=>o!==v).map(o=>itemStr(k,o));
    const o=uniqOpts(ans.replace(/ \(.*\)$/,''),cands.map(c=>c.replace(/ \(.*\)$/,'')));return o&&{r,q:`${nm} — ${k} 양은?`,opts:o,ans:ans.replace(/ \(.*\)$/,''),exp:ans};}
  if(t==='top'){const ans=topStr(r.top);const cands=RECIPES.map(x=>topStr(x.top));const o=uniqOpts(ans,cands.concat(['없음']));return o&&{r,q:`${nm} — 토핑은?`,opts:o,ans};}
  if(t==='order'){const ans=r.text;const cands=Object.values(ORD).map(o=>o[0]);const o=uniqOpts(ans,cands);return o&&{r,q:`${nm} — 제조순서로 맞는 것은?`,opts:o,ans};}
  if(t==='name'){const ans=nm;const others=pool.filter(x=>x!==r&&summaryOf(x)!==summaryOf(r)&&(x.cat===r.cat||Math.random()<.3)).map(x=>`${x.temp?x.temp+' ':''}${x.name}`);
    const o=uniqOpts(ans,others);return o&&{r,q:`이 레시피의 메뉴는?\n${summaryOf(r)}`,opts:o,ans};}
  return null;
}
function genQuestion(pool){
  for(let i=0;i<30;i++){const r=weightedPick(pool);const ts=['order','name'];
    if(r.cup!=='ESP')ts.push('cup');if(r.cat==='커피')ts.push('shots');if(r.liq.length)ts.push('liq','liq');if(Object.keys(r.ing).length)ts.push('ing','ing','ing');
    if(Object.keys(r.top).length)ts.push('top');if(r.cup!=='HOT'&&r.cup!=='ESP')ts.push('ice');if(r.blend)ts.push('blend');
    const q=makeQ(pick(ts),r,pool);if(q)return q;}
  return makeQ('cup',RECIPES[2],RECIPES);
}
function startQuiz(cats){
  const pool=poolFor(cats&&cats.length?'all':'all',cats);
  QZ={pool,i:0,n:10,ok:0,wrong:[],cur:null,cats};show('quiz');nextQ();
}
function nextQ(){
  if(QZ.i>=QZ.n)return quizEnd();
  QZ.cur=genQuestion(QZ.pool);QZ.answered=false;const q=QZ.cur;
  $('#quizRoot').innerHTML=`<div class="qhead"><button class="btn" id="qzQuit">← 그만</button><b>${QZ.i+1} / ${QZ.n}</b><span class="muted">정답 ${QZ.ok}</span></div>
   <div class="pbar2" style="margin-bottom:12px"><i style="width:${QZ.i/QZ.n*100}%"></i></div>
   <div class="card qcard"><div class="qq">${tempBadge(q.r)} ${esc(q.q).replace(/\n/g,'<br><span class="muted small" style="font-weight:600">')}</div>
   <div class="qopts">${q.opts.map((o,i)=>`<button class="qopt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="qExp"></div></div>`;
  $('#qzQuit').onclick=()=>goHome();
  const bs=[...document.querySelectorAll('#quizRoot .qopt')];
  bs.forEach(b=>b.onclick=()=>{if(QZ.answered)return;QZ.answered=true;const ok=q.opts[b.dataset.i]===q.ans;
    bs.forEach(x=>{if(q.opts[x.dataset.i]===q.ans)x.classList.add('right');});if(!ok){b.classList.add('wrong');QZ.wrong.push(q.r.no);}else QZ.ok++;
    sfx(ok?'ok':'bad');const s=stat(q.r.no);if(!ok){s.wrong++;s.streak=0;}persist();
    $('#qExp').innerHTML=`<p style="margin:12px 0 6px">${ok?'⭕ 정답!':'❌ 정답은: <b>'+esc(q.exp||q.ans)+'</b>'}</p><details><summary class="small muted" style="cursor:pointer">레시피 카드</summary>${recCard(q.r)}</details><div class="row end" style="margin-top:10px"><button class="btn primary" id="qNext">다음 →</button></div>`;
    $('#qNext').onclick=()=>{QZ.i++;nextQ();};});
}
function quizEnd(){
  SAVE.quizBest=Math.max(SAVE.quizBest||0,QZ.ok);persist();
  const w=[...new Set(QZ.wrong)];
  $('#quizRoot').innerHTML=`<div class="card" style="text-align:center"><h2>📝 퀴즈 끝!</h2><div class="grade">${QZ.ok}/${QZ.n}</div>
  ${w.length?`<h3 style="text-align:left">틀린 메뉴</h3><div class="bk-list" style="text-align:left">${w.map(no=>{const r=BYNO[no];return `<button class="bk-item" data-rno="${no}">${tempBadge(r)} ${esc(r.name)}</button>`}).join('')}</div>`:'<p>🎉 만점!</p>'}
  <div class="row" style="justify-content:center;margin-top:14px">${w.length?'<button class="btn" id="qzRev">🧪 틀린 메뉴 만들어보기</button>':''}<button class="btn" id="qzHome">메인</button><button class="btn primary" id="qzAgain">한 번 더</button></div></div>`;
  document.querySelectorAll('#quizRoot [data-rno]').forEach(b=>b.onclick=()=>showRecipe(BYNO[b.dataset.rno],true));
  const rv=$('#qzRev');if(rv)rv.onclick=()=>startPractice({only:w,label:'퀴즈 오답'});
  $('#qzHome').onclick=()=>goHome();$('#qzAgain').onclick=()=>startQuiz(QZ.cats);
}

   <li><b>✅ 제조 완료</b>를 누르면 컵·샷·얼음·액상·재료·토핑·블렌더·순서를 채점하고 정답 레시피를 보여줘요.</li>
   <li>틀린 메뉴는 다음 근무/퀴즈에 <b>더 자주</b> 나와요. 3번 연속 완벽하면 ★마스터!</li>
   <li>근무가 끝나면 <b>마감 청소</b> → <b>정산</b>. B등급 이상이면 다음 일차로 넘어가며 메뉴가 늘어나요.</li></ol>
   <p class="muted small">레시피 출처: 메가MGC커피 음료 간편레시피 2026.03ver. 실제 매장 지시가 우선이에요.</p>
   <div class="row end"><button class="btn primary" data-close>알겠어요</button></div>`,{pause:true});
  SAVE.seenHelp=true;persist();
}
function renderMenu(){
  const s=SAVE.settings;const m=RECIPES.filter(r=>mastered(r.no)).length;const tried=RECIPES.filter(r=>SAVE.stats[r.no]).length;
  $('#menuStats').innerHTML=`<div class="stat"><small>다음 근무</small><b>${SAVE.day}일차 · ${dayName(SAVE.day)}</b></div>
   <div class="stat"><small>근무 시간</small><b>18:00 ~ ${clk(s.close)}</b></div>
   <div class="stat"><small>★ 마스터 메뉴</small><b>${m} / ${RECIPES.length}</b></div>
   <div class="stat"><small>해 본 메뉴</small><b>${tried} / ${RECIPES.length}</b></div>`;
  $('#mStartTitle').textContent=`근무 시작 — ${SAVE.day}일차`;
  $('#mStartSub').textContent=`${dayName(SAVE.day)} 마감조 · ${s.n}잔 · ${DIFF[s.diff].label} · 메뉴: ${s.scope==='progress'?unlockedCats().join(', '):s.scope==='all'?'전체':'약한 메뉴'}`;
  const weak=RECIPES.filter(r=>{const x=SAVE.stats[r.no];return x&&x.wrong>0&&x.streak<3;}).sort((a,b)=>SAVE.stats[b.no].wrong-SAVE.stats[a.no].wrong).slice(0,8);
  $('#weakBox').innerHTML=weak.length?`<b>🔁 아직 헷갈리는 메뉴</b><div class="bk-list" style="margin-top:8px">${weak.map(r=>`<button class="bk-item" data-rno="${r.no}">${tempBadge(r)} ${esc(r.name)}<span class="p">오답 ${SAVE.stats[r.no].wrong}</span></button>`).join('')}</div><div class="row end" style="margin-top:8px"><button class="btn" id="wkGo">🧪 이 메뉴들 연습</button></div>`
    :`<b>👋 처음이세요?</b><p class="small muted" style="margin:6px 0 0">연습 모드로 아메리카노·라떼부터 만들어보고, 레시피 퀴즈로 감을 잡은 뒤 근무를 시작해보세요. 틀린 메뉴가 여기 모여요.</p>`;
  document.querySelectorAll('#weakBox [data-rno]').forEach(b=>b.onclick=()=>showRecipe(BYNO[b.dataset.rno],true));
  const wg=$('#wkGo');if(wg)wg.onclick=()=>startPractice({only:weak.map(r=>r.no),label:'헷갈리는 메뉴'});
}
function goHome(){G=null;B=null;closeModal();renderMenu();show('menu');}
$('#mStart').onclick=()=>startShift();
$('#mPractice').onclick=()=>practiceSetup();
$('#mQuiz').onclick=()=>quizSetup();
$('#mBook').onclick=()=>{show('book');renderBook($('#bookRoot'),false);};
$('#mClose').onclick=()=>startClosing(true);
$('#mSettings').onclick=()=>settingsModal();

renderMenu();
if(!SAVE.seenHelp)setTimeout(showHelp,300);
</script>
</body>
</html>
